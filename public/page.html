<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>misa.lol</title>
    <link rel="stylesheet" href="/page.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="m-card" id="card">
        <div class="flip-scene" id="flip-scene">
          <div class="flip-inner" id="flip-inner">
            <div class="flip-face face-front" id="face-front" aria-label="Card front">
              <div class="avatar" id="avatar" aria-hidden="true">?</div>
              <h1 id="name">—</h1>
              <p id="bio"></p>
              <p id="night-note" class="night-note" hidden></p>
              <ul id="front-blocks" class="face-blocks"></ul>
              <div id="link-wrap"></div>
              <div id="moon-wrap"></div>
            </div>
            <div class="flip-face face-back" id="face-back" aria-label="Card back" hidden>
              <p id="back-note" class="back-note"></p>
              <div id="back-link-wrap"></div>
              <ul id="back-blocks" class="face-blocks"></ul>
              <button id="back-to-front" type="button" class="back-btn">Back to front</button>
            </div>
          </div>
        </div>
        <button id="flip-corner" type="button" class="corner-btn" hidden>Flip</button>
      </section>
      <section class="m-card" id="draw-card" aria-label="Today's draw" hidden>
        <h2 class="h2">Today's draw</h2>
        <p id="draw-line" class="hand"></p>
      </section>
      <section class="m-card" id="capsule-card" aria-label="Time capsule" hidden>
        <h2 class="h2" id="capsule-label">A sealed message</h2>
        <div id="capsule-sealed" class="capsule-sealed">
          <p class="capsule-wax" aria-hidden="true">✉</p>
          <p class="capsule-count" id="capsule-count"></p>
        </div>
        <p id="capsule-body" class="capsule-body hand" hidden></p>
      </section>
      <section class="m-card" id="history-card" aria-label="Page history" hidden>
        <h2 class="h2">History</h2>
        <label class="history-label" for="history-select">View a past version of this page</label>
        <select id="history-select" class="history-select"></select>
        <div id="history-view" class="history-view"></div>
      </section>
      <section class="m-card" aria-label="Enabled features">
        <h2 class="h2">On this page</h2>
        <ul id="feature-labels" class="feature-labels"></ul>
      </section>
      <section class="m-card" id="neighbours-card" aria-label="Neighbours" hidden>
        <h2 class="h2">Neighbours</h2>
        <div id="neighbours-list" class="neighbour-list"></div>
      </section>
      <section class="m-card" id="guestbook" aria-label="Guestbook" hidden>
        <h2 class="h2" id="guestbook-heading">Guestbook</h2>
        <p id="guestbook-prompt" class="ask-prompt"></p>
        <div id="guestbook-entries"></div>
        <form id="guestbook-form">
          <input id="guestbook-name" type="text" maxlength="40" placeholder="Your name" aria-label="Your display name" />
          <textarea id="guestbook-message" rows="3" maxlength="200" placeholder="Write a short message…" aria-label="Your message"></textarea>
          <p id="guestbook-status" class="ask-status" hidden></p>
          <button type="submit" id="guestbook-submit">Sign</button>
        </form>
      </section>
      <section class="m-card" id="ask-anything" aria-label="Ask me anything" hidden>
        <h2 class="h2">Ask me anything</h2>
        <p id="ask-prompt" class="ask-prompt"></p>
        <div id="ask-published"></div>
        <form id="ask-form">
          <textarea id="ask-question" rows="4" placeholder="Write a question…" aria-label="Your question"></textarea>
          <input id="ask-contact" type="text" maxlength="200" placeholder="Contact (optional)" aria-label="Optional contact" />
          <p id="ask-status" class="ask-status" hidden></p>
          <button type="submit" id="ask-submit">Send</button>
        </form>
      </section>
      <p class="foot" id="foot"></p>
    </main>
    <script src="/page.js"></script>
  </body>
</html>
