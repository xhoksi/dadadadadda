<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>misa.lol — profile editor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand">misa.lol</span>
        <div class="login-cluster">
          <label for="demo-user">Demo user</label>
          <select id="demo-user">
            <option value="nova">nova (owner, lifetime)</option>
            <option value="luna">luna (owner, free)</option>
            <option value="admin">admin (platform admin)</option>
            <option value="mod">mod (moderator)</option>
          </select>
          <button id="login-button" type="button">Log in</button>
          <span id="login-status" class="status" role="status" aria-live="polite"></span>
        </div>
      </div>
    </header>

    <main class="layout">
      <div class="col">
        <section class="card">
          <header class="card-head">
            <h1>Profile editor</h1>
            <p class="sub">Edit your misa.lol profile and link.</p>
          </header>

          <form id="profile-form" novalidate>
            <div class="field">
              <label for="display-name">Display name</label>
              <input id="display-name" name="displayName" type="text" maxlength="40" autocomplete="off" />
              <p class="error" id="display-name-error" hidden></p>
            </div>

            <div class="field">
              <label for="bio">Bio</label>
              <textarea id="bio" name="bio" rows="3" maxlength="160"></textarea>
              <p class="error" id="bio-error" hidden></p>
            </div>

            <div class="field">
              <label for="link-label">Link label</label>
              <input id="link-label" name="linkLabel" type="text" maxlength="30" autocomplete="off" />
              <p class="error" id="link-label-error" hidden></p>
            </div>

            <div class="field">
              <label for="link-url">Link URL</label>
              <input id="link-url" name="linkUrl" type="text" inputmode="url" placeholder="https://…" autocomplete="off" />
              <p class="error" id="link-url-error" hidden></p>
            </div>

            <div class="actions">
              <button id="save-button" type="submit">Save</button>
              <p id="save-status" class="status" role="status" aria-live="polite"></p>
            </div>
          </form>
        </section>

        <section class="card features-card">
          <header class="card-head">
            <h1>Features</h1>
            <p class="sub">Toggles are live policy. Content stays a draft until Publish per feature.</p>
          </header>
          <div id="feature-list" aria-live="polite"></div>
        </section>

        <section class="card ask-card" id="ask-card" hidden>
          <header class="card-head">
            <h1>Ask me anything</h1>
            <p id="ask-card-sub" class="sub"></p>
          </header>
          <div id="ask-manager"></div>
        </section>

        <section class="card guestbook-card" id="guestbook-card" hidden>
          <header class="card-head">
            <h1>Guestbook</h1>
            <p id="guestbook-card-sub" class="sub"></p>
          </header>
          <div id="guestbook-manager"></div>
        </section>

        <section class="card neighbour-card" id="neighbour-card" hidden>
          <header class="card-head">
            <h1>Neighbours</h1>
            <p id="neighbour-card-sub" class="sub"></p>
          </header>
          <div id="neighbour-manager"></div>
        </section>

        <section class="card blocks-card" id="blocks-card" hidden>          <header class="card-head">
            <h1>Card layout</h1>
            <p id="blocks-card-sub" class="sub"></p>
          </header>
          <div id="blocks-manager"></div>
        </section>

        <section class="card draw-card" id="draw-card" hidden>
          <header class="card-head">
            <h1>The draw</h1>
            <p id="draw-card-sub" class="sub"></p>
          </header>
          <div id="draw-manager"></div>
        </section>

        <section class="card archive-card" id="archive-card" hidden>
          <header class="card-head">
            <h1>The archive</h1>
            <p id="archive-card-sub" class="sub"></p>
          </header>
          <div id="archive-manager"></div>
        </section>
      </div>

      <aside class="card preview-card" aria-label="Profile preview">
        <h2 class="h2">Preview</h2>
        <div class="profile-card">
          <div class="avatar" id="preview-avatar" aria-hidden="true">N</div>
          <h3 class="preview-name" id="preview-name">&nbsp;</h3>
          <p class="preview-bio" id="preview-bio"></p>
          <div class="preview-link" id="preview-link-wrap"></div>
        </div>
      </aside>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
